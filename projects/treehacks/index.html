<script type="module">
// Same logo geometry, line groups, Anime.js draw sequence, and session flag as homepage.
(async function(){
 const intro=document.getElementById('intro');
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(!intro || reduce || sessionStorage.getItem('introSeen')){ intro?.remove(); return; }
 sessionStorage.setItem('introSeen','1');
 let finished=false;
 function finish(){ if(finished)return;finished=true;intro.classList.add('done');setTimeout(()=>intro.remove(),650); }
 const failSafe=setTimeout(finish,5500);
 try {
   const {animate,svg}=await import('https://cdn.jsdelivr.net/npm/animejs@4.0.2/+esm');
   const all=[...intro.querySelectorAll('.intro-logo line')];
   const highlight=[20,21,22,23,24,25,27,28];
   const isHi=e=>highlight.includes(Number(e.dataset.i));
   const base=svg.createDrawable(all.filter(e=>!isHi(e)));
   const hi=svg.createDrawable(all.filter(isHi));
   base.forEach(l=>l.setAttribute('draw','0 0'));
   hi.forEach(l=>l.setAttribute('draw','0 0'));
   intro.querySelector('.intro-logo').classList.add('ready');
   animate(base,{draw:'0 1',ease:'inOutQuad',duration:800,delay:(el,i)=>i*26,onComplete:()=>{
     animate(hi,{draw:'0 1',ease:'outQuad',duration:520,delay:(el,i)=>i*70,onComplete:()=>{setTimeout(()=>{clearTimeout(failSafe);finish()},650)}});
   }});
 } catch(e){clearTimeout(failSafe);finish()}
})();
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const stage=document.querySelector('#stage'),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;stage.prepend(renderer.domElement);document.querySelector('#loading')?.remove();
const scene=new THREE.Scene();scene.background=new THREE.Color('#0c1519');scene.fog=new THREE.FogExp2('#0c1519',.017);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,400);let yaw=.7,pitch=.44,dist=58;const target=new THREE.Vector3(0,7,0);function positionCamera(){camera.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(target)}positionCamera();
const hemi=new THREE.HemisphereLight(0x9ecde1,0x344539,2.1);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffd5a2,3.0);sun.position.set(-20,35,24);scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});const grass=mat('#253f34'),path=mat('#b7a68b'),stone=mat('#b99c77'),stoneDark=mat('#876c51'),roof=mat('#8d5340'),dark=mat('#33444b'),leaf=mat('#426c47'),leaf2=mat('#78905b'),bark=mat('#604735');

function box(parent,w,h,d,m,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);parent.add(mesh);return mesh}
function cylinder(parent,r1,r2,h,m,x,y,z,segments=9){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),m);mesh.position.set(x,y,z);parent.add(mesh);return mesh}
function cone(parent,r,h,m,x,y,z,n=8){const mesh=new THREE.Mesh(new THREE.ConeGeometry(r,h,n),m);mesh.position.set(x,y,z);parent.add(mesh);return mesh}
box(base,72,1.2,59,grass,0,-.7,0);box(base,9,.07,57,path,0,.03,0);box(base,62,.07,4,path,0,.04,7);
// Recognizable stylized landmark massing, not surveyed architectural geometry.
function hoover(x,z){const g=new THREE.Group();g.position.set(x,0,z);base.add(g);box(g,5,19,5,stone,0,9.5,0);for(let i=0;i<4;i++){box(g,6.1,.55,6.1,stoneDark,0,2+i*4.1,0)}box(g,7,2,7,stoneDark,0,19.9,0);box(g,8,1,8,stone,0,21.4,0);for(let side of [-1,1])for(let i=-1;i<=1;i++)box(g,.42,1.7,.16,dark,i*1.45,19.6,side*3.54);cone(g,5.4,3.3,roof,0,23.5,0,4).rotation.y=Math.PI/4;box(g,1,1,1,stone,0,25.3,0);return g}
hoover(17,-10);
function arcade(x,z,w){const g=new THREE.Group();g.position.set(x,0,z);base.add(g);box(g,w,5,5,stone,0,2.5,0);box(g,w+1,.7,6,roof,0,5.3,0);for(let i=-Math.floor(w/3)/2;i<=Math.floor(w/3)/2;i++){const col=x===0?i*3:i*3;box(g,.45,3,.55,stoneDark,col,1.5,2.65)}return g}
arcade(-11,-17,23);arcade(0,-24,19);arcade(11,-17,12);
// Church-like gabled centerpiece, simplified.
box(base,9,9,8,stone,0,4.5,-20);cone(base,7.2,5.6,roof,0,11.7,-20,4).rotation.y=Math.PI/4;box(base,2,4,.17,dark,0,2,-15.9);
for(let x of [-20,-14,-8,8,14,20])for(let z of [-1,11,21]){if(x>12&&z<1)continue;box(base,1,.4,1,stoneDark,x,.2,z)}
const trees=[],fireflies=[];const treePositions=[];for(let row of [-1,1])for(let i=0;i<12;i++)treePositions.push([row*(8+(i%3)*1.5),-19+i*4.5]);for(let i=0;i<32;i++){const a=i*2.39996,r=25+Math.sqrt(i)*2.3;treePositions.push([Math.cos(a)*r,Math.sin(a)*r*.68])}
function makeTree(x,z,i){const group=new THREE.Group();group.position.set(x,0,z);base.add(group);const h=3.2+(i%5)*.35;const crown=new THREE.Group();group.add(crown);cylinder(group,.24,.4,h,bark,0,h/2,0,7);for(let j=0;j<3;j++){const mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(1.65+(j%2)*.35,0),j%2?leaf2:leaf);mesh.position.set(Math.sin(i+j)*.55,h+j*.75,Math.cos(i*.3+j)*.4);crown.add(mesh)}trees.push({group,crown,h,seed:i})}treePositions.forEach((p,i)=>makeTree(p[0],p[1],i));
const specks=new THREE.Group();scene.add(specks);const glowMat=new THREE.MeshBasicMaterial({color:0xffd078,transparent:true,opacity:0.02});const glowGeo=new THREE.SphereGeometry(.095,5,4);for(let i=0;i<175;i++){const m=new THREE.Mesh(glowGeo.clone(),glowMat.clone());const a=i*2.39996,r=4+Math.sqrt(i)*2.2;m.position.set(Math.cos(a)*r,1+(i*17%100)/18,Math.sin(a)*r*.85);m.userData={x:m.position.x,y:m.position.y,z:m.position.z,phase:i*.7};specks.add(m);fireflies.push(m)}
const groundLight=new THREE.PointLight(0xffba63,0,55,1.5);groundLight.position.set(1,9,3);scene.add(groundLight);
let state='accept',blend=0,desired=1;const backgroundLight=new THREE.Color('#0c1519'),aliveBg=new THREE.Color('#18332e'),sadBg=new THREE.Color('#0a1019');const cAlive=new THREE.Color('#5a9253'),cSad=new THREE.Color('#394548');let isDown=false,oldX=0,oldY=0;
renderer.domElement.addEventListener('pointerdown',e=>{isDown=true;oldX=e.clientX;oldY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>isDown=false);renderer.domElement.addEventListener('pointermove',e=>{if(!isDown)return;yaw-=(e.clientX-oldX)*.006;pitch=Math.max(.12,Math.min(1.15,pitch+(e.clientY-oldY)*.004));oldX=e.clientX;oldY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{if(e.shiftKey)dist=Math.max(24,Math.min(90,dist+e.deltaY*.035))},{passive:true});
function decide(s){state=s;desired=s==='accept'?1:-1;for(const id of ['accept','reject']){const el=document.getElementById(id);const on=s===id;el.classList.toggle('selected',on);el.setAttribute('aria-pressed',String(on))}document.querySelector('#title').innerHTML=s==='accept'?'TreeHacks <em>with</em> Daniel.':'TreeHacks <em>without</em> Daniel.';}
document.querySelector('#accept').onclick=()=>decide('accept');document.querySelector('#reject').onclick=()=>decide('reject');
decide('accept');const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),delta=Math.min(.04,clock.getDelta());blend+=(desired-blend)*.035;const good=Math.max(0,blend),bad=Math.max(0,-blend);scene.background.copy(backgroundLight).lerp(aliveBg,good*.95).lerp(sadBg,bad*.9);scene.fog.color.copy(scene.background);hemi.intensity=2.1+good*.7-bad*1.5;sun.intensity=2.5+good*2-bad*2.15;groundLight.intensity=good*36;renderer.toneMappingExposure=1.17+good*.23-bad*.42;grass.color.set('#253f34').lerp(new THREE.Color('#365d38'),good).lerp(new THREE.Color('#252c2a'),bad);for(const tr of trees){tr.crown.scale.setScalar(Math.max(.3,1+good*.27-bad*.65));tr.crown.rotation.y=.05*Math.sin(t*.35+tr.seed);for(const m of tr.crown.children)m.material=(tr.seed%2?leaf2:leaf);tr.crown.position.y=.15*Math.sin(t*.7+tr.seed)*good}leaf.color.copy(cAlive).lerp(cSad,bad*.92);leaf2.color.set('#78905b').lerp(cSad,bad*.88);fireflies.forEach(f=>{f.position.x=f.userData.x+Math.sin(t*.5+f.userData.phase)*.6;f.position.y=f.userData.y+Math.sin(t+f.userData.phase)*.5;f.material.opacity=good*(.32+.6*(.5+.5*Math.sin(t*2.6+f.userData.phase)))});positionCamera();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
