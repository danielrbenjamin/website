<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMS Hand — Grip</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e0f;--panel:#141819;--line:#23292b;--line-bright:#2f383a;
  --ink:#dce3e0;--ink-dim:#8a9794;--ink-faint:#5c6764;
  --amber:#ffb454;--green:#5ee6a0;--grid:rgba(255,255,255,.022);
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --disp:"Space Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--disp);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
}
::selection{background:var(--amber);color:#0c0e0f}
.stage{position:relative;width:100%;height:100vh;overflow:hidden}
#cv{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--mono)}
.hud .eyebrow{position:absolute;top:32px;left:32px;font-size:12px;color:var(--amber);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.hud .eyebrow::before{content:"";width:26px;height:1px;background:var(--amber)}
.hud h2{position:absolute;top:54px;left:32px;font-family:var(--disp);font-size:clamp(1.6rem,4vw,2.4rem);font-weight:600;letter-spacing:-.02em}
.hud .readout{position:absolute;bottom:34px;left:32px;font-size:12px;color:var(--ink-dim);display:flex;flex-direction:column;gap:6px}
.hud .readout .k{color:var(--ink-faint)}
.hud .readout .v{color:var(--green)}
.controls{position:absolute;bottom:34px;right:32px;display:flex;gap:10px;pointer-events:auto}
.btn{font-family:var(--mono);font-size:12px;padding:9px 15px;border:1px solid var(--line-bright);border-radius:2px;color:var(--ink);background:rgba(20,24,25,.7);backdrop-filter:blur(6px);cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.active{border-color:var(--green);color:var(--green)}
.note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--ink-dim);text-align:center;padding:20px}
.note b{color:var(--amber)}
.note .blink{display:inline-block;width:8px;height:14px;background:var(--green);margin-left:4px;vertical-align:-2px;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>

<section class="stage">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="eyebrow">Robotics — MEMS Hand</div>
    <h2>Soft-actuated grip</h2>
    <div class="readout">
      <span><span class="k">parts</span> <span class="v" id="r-parts">—</span></span>
      <span><span class="k">state</span> <span class="v" id="r-state">open</span></span>
    </div>
    <div class="controls">
      <button class="btn active" id="btn-loop">◉ auto-loop</button>
      <button class="btn" id="btn-spin">↻ spin</button>
    </div>
  </div>
  <div class="note" id="note">loading model<span class="blink"></span></div>
</section>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/* ===== CONFIG ===== */
const MODEL_URL   = 'hand.glb';
const CURL_AXIS   = new THREE.Vector3(1, 0, 0);  // knuckle bend axis — flip/change if fingers curl wrong way
const MAX_CURL    = 0.2;   // radians per joint at full fist; compounds across 3 joints
const CURL_PERIOD = 5;    // seconds for a full open→fist→open cycle
const AUTO_SPIN   = 0.15;   // idle turntable speed (rad/s)

// finger group node names are all "Thumb"; we identify the 5 finger roots by
// being direct children of "MEMS Hand" that themselves have children.
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const canvas = document.getElementById('cv');
const noteEl = document.getElementById('note');
const rParts = document.getElementById('r-parts');
const rState = document.getElementById('r-state');

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.001, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false; controls.minDistance = 0.15; controls.maxDistance = 3;

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x202428, 1.0));
const key=new THREE.DirectionalLight(0xffffff,2.3); key.position.set(2,3,2); scene.add(key);
const rim=new THREE.DirectionalLight(0xffb454,0.7); rim.position.set(-3,1,-2); scene.add(rim);
const fill=new THREE.DirectionalLight(0x5ee6a0,0.25); fill.position.set(0,-2,3); scene.add(fill);

let model=null, spinOn=false, loopOn=true, t=0, modelRadius=0.1;
const fingers=[];   // { group, phalanges:[{node, curlFactor}] }

const draco=new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader=new GLTFLoader(); loader.setDRACOLoader(draco);

loader.load(MODEL_URL, (gltf)=>{
  model=gltf.scene;

  // center + frame
  const box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  modelRadius=Math.max(size.x,size.y,size.z)*0.5||0.1;
  model.position.sub(center);
  scene.add(model);

  // identify finger groups. GLTFLoader sanitizes names (spaces→underscores) and
  // de-dupes ("Thumb", "Thumb_1"...). The 5 finger groups are Object3Ds named
  // Thumb* with several phalange children.
  let partCount=0; model.traverse(o=>{ if(o.isMesh) partCount++; });

  const groups=[];
  const proxPins=[];
  model.traverse(o=>{
    if(!o.isMesh && /^Thumb(_\d+)?$/.test(o.name) && o.children.length>=4) groups.push(o);
    if(o.isMesh && /Proximal_Pin/i.test(o.name)) proxPins.push(o);
  });

  model.updateMatrixWorld(true);

  // Build a proper kinematic chain per finger, rotating each phalanx about the
  // PIN it hinges on (the pins are the real hardware hinge axes). The pins are
  // thin cylinders whose long axis is X, so each joint rotates about X through
  // the pin's centre. We nest three pivots so downstream segments follow:
  //   knuckle  → carries whole finger (proximal + everything above)
  //   middlePin→ carries middle + distal + fingertip
  //   distalPin→ carries distal + fingertip
  const _box=new THREE.Box3();
  const worldCenterOf = (obj)=>{ _box.setFromObject(obj); return _box.getCenter(new THREE.Vector3()); };

  // helper: create a pivot Object3D at world point P (in `parent` space) and
  // move the given nodes under it, preserving each node's world transform.
  function makePivot(parent, worldPoint, nodes, name){
    const pivot=new THREE.Object3D();
    pivot.name=name;
    parent.updateMatrixWorld(true);
    pivot.position.copy(parent.worldToLocal(worldPoint.clone()));
    parent.add(pivot);
    pivot.updateMatrixWorld(true);
    const invPivot=new THREE.Matrix4().copy(pivot.matrixWorld).invert();
    for(const n of nodes){
      const wp=new THREE.Vector3(), wq=new THREE.Quaternion(), ws=new THREE.Vector3();
      n.getWorldPosition(wp); n.getWorldQuaternion(wq); n.getWorldScale(ws);
      pivot.add(n);
      const m=new THREE.Matrix4().compose(wp,wq,ws).premultiply(invPivot);
      m.decompose(n.position,n.quaternion,n.scale);
    }
    pivot.userData.rest=pivot.quaternion.clone();
    return pivot;
  }

  for(const g of groups){
    const parent=g.parent;
    // collect the named parts of this finger
    const find = re => g.children.find(c=>re.test(c.name));
    const proximal = find(/Proximal_Phalanx/i);
    const middle   = find(/Middle_Phalanx/i);
    const distal   = find(/Distal_Phalanx/i);
    const fingertip= find(/Fingertip/i);
    const middlePin= find(/Middle_Pin/i);
    const distalPin= find(/Distal_Pin/i);

    if(!proximal || !middle || !distal){
      // fallback: rotate whole group about its base if structure unexpected
      _box.setFromObject(g);
      const knuckle=new THREE.Vector3((_box.min.x+_box.max.x)/2,_box.min.y,(_box.min.z+_box.max.z)/2);
      const kp=makePivot(parent,knuckle,[g],g.name+'__knuckle');
      fingers.push({ joints:[{pivot:kp,w:1}] });
      continue;
    }

    // pivot world points = pin centres (distal & middle).
    const pDistal = distalPin ? worldCenterOf(distalPin) : worldCenterOf(distal);
    const pMiddle = middlePin ? worldCenterOf(middlePin) : worldCenterOf(middle);

    // knuckle hinge = the PROXIMAL PIN this finger rotates about. There are only
    // three proximal pins (Main spans several fingers, plus Index and Thumb), so
    // we find the nearest one and hinge about it — using the pin's Y/Z (the true
    // hinge-axis height) with the finger's own X position along that shared axis.
    const proxWorld = worldCenterOf(proximal);
    let pKnuckle;
    if(proxPins.length){
      let best=null, bestD=Infinity;
      for(const pin of proxPins){
        const pc=worldCenterOf(pin);
        // distance in Y/Z plane (which pin's hinge line is nearest this finger)
        const d=Math.hypot(pc.y-proxWorld.y, pc.z-proxWorld.z);
        if(d<bestD){ bestD=d; best=pc; }
      }
      pKnuckle=new THREE.Vector3(proxWorld.x, best.y, best.z);
    }else{
      const pbox=new THREE.Box3().setFromObject(proximal);
      pKnuckle=new THREE.Vector3((pbox.min.x+pbox.max.x)/2, pbox.min.y, (pbox.min.z+pbox.max.z)/2);
    }

    // innermost first: distal pin carries distal + fingertip (+ distal pin)
    const distalNodes=[distal]; if(fingertip) distalNodes.push(fingertip); if(distalPin) distalNodes.push(distalPin);
    const distalPivot=makePivot(g, pDistal, distalNodes, g.name+'__distal');

    // middle pin carries middle phalanx + the distal pivot (+ middle pin)
    const middleNodes=[middle, distalPivot]; if(middlePin) middleNodes.push(middlePin);
    const middlePivot=makePivot(g, pMiddle, middleNodes, g.name+'__middle');

    // knuckle carries the whole finger group (everything remaining under g)
    const knucklePivot=makePivot(parent, pKnuckle, [g], g.name+'__knuckle');

    // weights: knuckle bends most, then middle, then distal (natural curl)
    fingers.push({ joints:[
      { pivot:knucklePivot, w:1.00 },
      { pivot:middlePivot,  w:0.85 },
      { pivot:distalPivot,  w:0.70 },
    ]});
  }

  rParts.textContent = `${partCount} parts · ${fingers.length} fingers`;
  noteEl.style.display='none';

  // camera frame — slightly front-and-below so the curl reads clearly
  const dist = modelRadius / Math.tan((camera.fov*Math.PI/180)/2) * 2.3;
  camera.position.set(dist*0.15, dist*0.05, dist*0.98);
  controls.target.set(0, modelRadius*0.15, 0); controls.update();

  applyCurl(0);
}, (xhr)=>{
  if(xhr.total) noteEl.innerHTML=`loading model — ${Math.round(xhr.loaded/xhr.total*100)}%`;
}, (err)=>{
  console.error(err);
  noteEl.innerHTML=`couldn't load <b>${MODEL_URL}</b><br>make sure it sits next to this file`;
});

// curl: c in 0..1 (0 open, 1 fist). rotate every joint about its pin (X axis),
// each scaled by its weight so the finger folds naturally along the chain.
const q=new THREE.Quaternion();
function applyCurl(c){
  const eased = c*c*(3-2*c); // smoothstep
  for(const f of fingers){
    for(const j of f.joints){
      q.setFromAxisAngle(CURL_AXIS, eased*MAX_CURL*j.w);
      j.pivot.quaternion.copy(j.pivot.userData.rest).multiply(q);
    }
  }
  rState.textContent = c<0.04?'open':c>0.96?'fist':(c<0.5?'closing':'opening');
}

document.getElementById('btn-loop').onclick=(e)=>{ loopOn=!loopOn; e.target.classList.toggle('active',loopOn); e.target.textContent = loopOn?'◉ auto-loop':'▷ paused'; };
document.getElementById('btn-spin').onclick=(e)=>{ spinOn=!spinOn; e.target.classList.toggle('active',spinOn); };

function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==w||canvas.height!==h){ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
}
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  resize();
  if(fingers.length && loopOn && !reduce){
    t+=dt;
    // triangle wave 0→1→0 over CURL_PERIOD
    const phase=(t % CURL_PERIOD)/CURL_PERIOD;
    const c = phase<0.5 ? phase*2 : (1-phase)*2;
    applyCurl(c);
  }
  if(model && spinOn) model.rotation.y += AUTO_SPIN*dt;
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
