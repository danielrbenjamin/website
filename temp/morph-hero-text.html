:root{
  --bg:#0c0e0f;--panel:#141819;--line:#23292b;--line-bright:#2f383a;
  --ink:#dce3e0;--ink-dim:#8a9794;--ink-faint:#5c6764;
  --amber:#ffb454;--green:#5ee6a0;--grid:rgba(255,255,255,.022);
  --mono:"JetBrains Mono",ui-monospace,monospace;--disp:"Space Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--disp);overflow-x:hidden}
.scroll-stage{position:relative;height:220vh}
.hero{position:sticky;top:0;height:100vh;min-height:640px;overflow:hidden;
  background:radial-gradient(130% 100% at 70% 40%, #15181a 0%, #0a0c0d 65%);}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.grid-bg{position:absolute;inset:0;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px;}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;z-index:10;font-family:var(--mono);font-size:12.5px}
.bar .navlogo{width:22px;color:var(--amber)}
.bar .id{display:flex;align-items:center;gap:10px;font-weight:500}
.bar nav{display:flex;gap:22px;color:var(--ink-dim)}
.bar nav a{color:inherit;text-decoration:none;transition:.15s}
.bar nav a:hover{color:var(--amber)}

/* overlaid type — the thesis */
.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;
  padding:0 56px;pointer-events:none}
.overlay .kicker{font-family:var(--mono);font-size:13px;color:var(--amber);letter-spacing:.26em;text-transform:uppercase;margin-bottom:20px}
.overlay h1{font-family:"Archivo",sans-serif;font-weight:900;font-size:clamp(2.8rem,9vw,7.5rem);line-height:.9;letter-spacing:-.03em;text-shadow:0 4px 40px rgba(0,0,0,.6)}
.overlay h1 .a{color:var(--amber)}
.overlay .role{margin-top:22px;font-family:var(--mono);font-size:clamp(.82rem,1.6vw,1.05rem);color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase}
.overlay .role b{color:var(--ink)}
.overlay .cta{margin-top:36px;display:flex;gap:14px;pointer-events:auto}
.btn{font-family:var(--mono);font-size:13px;padding:13px 24px;border:1px solid var(--line-bright);color:var(--ink);text-decoration:none;transition:.15s;background:rgba(12,14,15,.4);backdrop-filter:blur(4px)}
.btn.solid{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.solid:hover{background:var(--green);border-color:var(--green);color:#000}
.hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:6;font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.2em;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.9}}
.loading{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--ink-dim);background:var(--bg)}
.loading .blink{display:inline-block;width:8px;height:14px;background:var(--amber);margin-left:5px;animation:bl 1s step-end infinite}
@keyframes bl{50%{opacity:0}}

/* index-style intro loader */
#intro{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  transition:opacity .6s ease;
}
#intro.done{opacity:0;pointer-events:none}
#intro .intro-logo{width:150px;color:var(--amber);visibility:hidden}
#intro .intro-logo.ready{visibility:visible}
#intro .intro-logo line{
  stroke:var(--amber);stroke-width:4;stroke-linecap:round;
  vector-effect:non-scaling-stroke;
  opacity:.32;
}
#intro .intro-logo line[data-i="20"],
#intro .intro-logo line[data-i="21"],
#intro .intro-logo line[data-i="22"],
#intro .intro-logo line[data-i="23"],
#intro .intro-logo line[data-i="24"],
#intro .intro-logo line[data-i="25"],
#intro .intro-logo line[data-i="27"],
#intro .intro-logo line[data-i="28"]{opacity:1}
#intro .intro-name{
  font-family:var(--mono);font-size:12px;letter-spacing:.32em;color:var(--ink-faint);
  text-transform:uppercase;opacity:0;transition:opacity .5s ease .1s;
}
#intro.reveal-name .intro-name{opacity:1}
html.intro-active{overflow:hidden}
@media(max-width:680px){.overlay{padding:0 28px}.bar nav{display:none}}
@media(prefers-reduced-motion:reduce){.hint{animation:none}#intro{display:none}}

<script type="module">
/* index intro animation (once per session) */
(async function(){
  const intro = document.getElementById('intro');
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!intro || reduce || sessionStorage.getItem('introSeen')){
    window.__introDone = true;
    window.dispatchEvent(new Event('intro:done'));
    if(intro) intro.remove();
    document.documentElement.classList.remove('intro-active');
    return;
  }
  sessionStorage.setItem('introSeen','1');

  let cleared = false;
  function finish(){
    if(cleared) return;
    cleared = true;
    window.__introDone = true;
    window.dispatchEvent(new Event('intro:done'));
    intro.classList.add('done');
    document.documentElement.classList.remove('intro-active');
    setTimeout(()=> intro.remove(), 650);
  }
  const failSafe = setTimeout(finish, 5500);

  try{
    const { animate, svg } = await import('https://cdn.jsdelivr.net/npm/animejs@4.0.2/+esm');
    const allLineEls = [...intro.querySelectorAll('.intro-logo line')];
    const HIGHLIGHT = [20,21,22,23,24,25,27,28];
    const dataI = el => parseInt(el.getAttribute('data-i'), 10);
    const isHi = el => HIGHLIGHT.includes(dataI(el));

    const baseEls = allLineEls.filter(l=>!isHi(l));
    const hiEls = allLineEls.filter(l=>isHi(l));
    const base = svg.createDrawable(baseEls);
    const hi = svg.createDrawable(hiEls);
    base.forEach(l => l.setAttribute('draw','0 0'));
    hi.forEach(l => l.setAttribute('draw','0 0'));

    intro.querySelector('.intro-logo').classList.add('ready');
    animate(base, {
      draw: '0 1',
      ease: 'inOutQuad',
      duration: 800,
      delay: (el,i)=> i*26,
      onComplete: ()=>{
        animate(hi, {
          draw: '0 1',
          ease: 'outQuad',
          duration: 520,
          delay: (el,i)=> i*70,
          onComplete: ()=>{
            intro.classList.add('reveal-name');
            setTimeout(()=>{ clearTimeout(failSafe); finish(); }, 650);
          }
        });
      }
    });
  }catch(e){
    clearTimeout(failSafe);
    finish();
  }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const CONFIG = {
  MODEL_URL: 'fullcar.glb',
  POINT_COUNT: 11000,        // sampled glyphs on the car surface
  GLYPHS: '01</>{}[]=+*#01ANSYSMECHΣΩλµ01',  // characters that appear
  AMBER: new THREE.Color('#ffb454'),
  GREEN: new THREE.Color('#5ee6a0'),
};

const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const canvas = document.getElementById('cv');
const loading = document.getElementById('loading');

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;   // match chassis-viewer's color pipeline
renderer.setClearColor(0x000000,0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(10,1,0.5,2000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.enablePan=false; controls.enableZoom=false;
controls.autoRotate=true; controls.autoRotateSpeed=0.55;

// ---- build a glyph atlas texture (grid of characters) ----
function buildGlyphAtlas(glyphs){
  const uniq=[...new Set(glyphs.split(''))];
  const cols=Math.ceil(Math.sqrt(uniq.length));
  const rows=Math.ceil(uniq.length/cols);
  const cell=64;
  const cv=document.createElement('canvas');
  cv.width=cols*cell; cv.height=rows*cell;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';
  ctx.font='bold 42px "JetBrains Mono", monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  uniq.forEach((ch,i)=>{
    const cx=(i%cols)*cell+cell/2, cy=Math.floor(i/cols)*cell+cell/2;
    ctx.fillText(ch,cx,cy);
  });
  const tex=new THREE.CanvasTexture(cv);
  tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
  return { tex, uniq, cols, rows };
}
const atlas = buildGlyphAtlas(CONFIG.GLYPHS);


// ---- custom shader: each point is a glyph billboard that shimmers ----
// uProgress drives the pre-stage morph from name glyphs -> car glyph cloud.
const uniforms = { uTime:{value:0}, uProgress:{value:0} };
const vert=`
  uniform float uTime,uSize,uPixelRatio,uCols,uRows,uNumGlyph;
  uniform float uProgress;     // 0..1 name -> car assemble
  uniform float uNear,uFar;    // view-depth range for depth cueing
  uniform highp float uDissolve;     // 0→1 scroll morph: glyphs scatter/fade away
  attribute float aRand;
  attribute vec3 aStart;
  varying float vGlyph; varying float vBright; varying float vGreen; varying float vFalling; varying float vDepth;
  void main(){
    float assemble = smoothstep(0.0, 1.0, uProgress);
    vec3 target=position;

    // Pre-stage: a text-shaped point field morphs into the car point cloud.
    vec3 p = mix(aStart, target, assemble);

    // idle drift grows in as the car resolves so the initial text feels crisp.
    float s=sin(uTime*1.1+aRand*30.0);
    p += 0.04*vec3(sin(uTime*0.7+aRand*10.0),cos(uTime*0.9+aRand*13.0),sin(uTime*1.1+aRand*17.0))*s*assemble;

    // tiny dephase jitter while still text-like to avoid a static bitmap look.
    float j = (1.0-assemble)*(0.8 + 0.2*fract(aRand*11.0));
    p += vec3(0.08*sin(uTime*1.7+aRand*19.0), 0.06*cos(uTime*1.4+aRand*23.0), 0.05*sin(uTime*1.2+aRand*29.0))*j;

    vFalling = 1.0-assemble;

    // dissolve: as scroll morphs code→solid, glyphs drift outward and up, thinning
    // out so the solid car underneath is revealed.
    if(uDissolve>0.0){
      vec3 dir=normalize(p+vec3(0.001));
      p += dir*uDissolve*40.0*fract(aRand*7.0) + vec3(0.0, uDissolve*30.0, 0.0);
    }

    vec4 mv=modelViewMatrix*vec4(p,1.0);
    gl_Position=projectionMatrix*mv;
    gl_PointSize=uSize*uPixelRatio*(300.0/-mv.z)*(0.6+0.4*aRand);

    // depth cue: 0 = nearest, 1 = farthest (view-space Z is negative)
    vDepth = clamp((-mv.z - uNear)/(uFar - uNear), 0.0, 1.0);

    // glyph swap starts faster while in the text stage, then settles on the car.
    float rate = mix(7.5, 0.9, assemble);
    float swap=floor(uTime*rate+aRand*50.0);
    vGlyph=mod(floor(aRand*uNumGlyph)+swap, uNumGlyph);

    // brightness: crisper text stage, softer settled shimmer.
    float land = 0.35+0.65*pow(0.5+0.5*sin(uTime*2.0+aRand*40.0),2.0);
    vBright = mix(0.95, land, assemble);
    // slightly greener while text-like, amber-biased once assembled.
    vGreen = mix(0.7, step(0.93,fract(aRand*7.0+floor(uTime*0.5))), assemble);
  }`;
const frag=`
  precision mediump float;
  uniform sampler2D uTex; uniform float uCols,uRows,uNumGlyph; uniform float uBright;
  uniform vec3 uAmber,uGreen,uFog;
  uniform highp float uDissolve;
  varying float vGlyph; varying float vBright; varying float vGreen; varying float vFalling; varying float vDepth;
  void main(){
    float gi=vGlyph;
    float col=mod(gi,uCols); float row=floor(gi/uCols);
    vec2 cell=vec2(1.0/uCols,1.0/uRows);
    vec2 uv=vec2(col,row)*cell + gl_PointCoord*cell;
    float a=texture2D(uTex,uv).r;
    if(a<0.3) discard;

    vec3 c=mix(uAmber,uGreen,vGreen)*(0.7+0.3*vBright)*uBright;

    // ---- depth cue (subtle): enough to separate front from back, but the far
    // side must stay clearly visible so the car silhouette still reads. ----
    float depthDim = mix(1.12, 0.72, vDepth);      // near lifted, far only gently dimmed
    c *= depthDim;
    // light atmospheric fade toward background with distance
    c = mix(c, uFog, vDepth*0.28);
    // far glyphs lose only a touch of opacity
    float alpha = a * mix(1.0, 0.82, vDepth);

    // dissolve fade — staggered so glyphs wink out at different times
    if(uDissolve>0.0){
      float thresh = fract(vGlyph*0.13 + 0.5);   // per-glyph dissolve point
      alpha *= 1.0 - smoothstep(thresh-0.2, thresh+0.2, uDissolve);
    }

    gl_FragColor=vec4(c, alpha);
  }`;

const loader=null;
// Two-layer point cloud, Poisson-disk sampled offline (car-points.json):
//   • SHAPE layer  — dense, small, dim glyphs that hold the car's silhouette
//   • LEGIBLE layer— sparse, large, bright glyphs you can actually read
// Even (blue-noise) spacing means no clumps, so both layers read cleanly.
let points=null, points2=null;
const SHAPE_BRIGHT_BASE = 0.72;
const LEGIBLE_BRIGHT_BASE = 1.0;
let nameAssemble = 0;
let nameAssembleStart = null;
let pointsReady = false;
let introReady = !!window.__introDone;
const NAME_HOLD_DURATION = 1.15;
const NAME_ASSEMBLE_DURATION = 2.2;

function maybeStartNameAssemble(){
  if(reduce){ nameAssemble = 1; return; }
  if(pointsReady && introReady && nameAssembleStart===null){
    nameAssembleStart = clock.getElapsedTime();
  }
}

if(!introReady){
  window.addEventListener('intro:done', ()=>{
    introReady = true;
    maybeStartNameAssemble();
  }, { once:true });
}

function buildTextPointCloud(count, opts={}){
  const text = opts.text || 'DANIEL BENJAMIN';
  const font = opts.font || '900 130px "Space Grotesk", "Archivo", sans-serif';
  const w = opts.width || 1400;
  const h = opts.height || 300;
  const outW = opts.outWidth || 300;
  const outH = opts.outHeight || 58;
  const depth = opts.depth || 8;
  const step = opts.step || 3;

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently:true });
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = font;
  ctx.fillText(text, w*0.5, h*0.52);

  const img = ctx.getImageData(0,0,w,h).data;
  const samples = [];
  for(let y=0; y<h; y+=step){
    for(let x=0; x<w; x+=step){
      const a = img[(y*w + x)*4 + 3];
      if(a>20) samples.push([x,y]);
    }
  }

  if(samples.length===0){
    const fallback = new Float32Array(count*3);
    for(let i=0;i<count;i++){
      fallback[i*3] = (Math.random()-0.5)*outW;
      fallback[i*3+1] = (Math.random()-0.5)*outH;
      fallback[i*3+2] = (Math.random()-0.5)*depth;
    }
    return fallback;
  }

  const pts = new Float32Array(count*3);
  const sx = outW / w;
  const sy = outH / h;
  for(let i=0;i<count;i++){
    const s = samples[(Math.random()*samples.length)|0];
    const nx = (s[0] - w*0.5) * sx;
    const ny = (h*0.5 - s[1]) * sy;
    pts[i*3] = nx;
    pts[i*3+1] = ny;
    pts[i*3+2] = (Math.random()-0.5)*depth;
  }
  return pts;
}

function sampleFromPointCloud(srcPts, targetCount){
  const out = new Float32Array(targetCount*3);
  const srcCount = (srcPts.length/3)|0;
  if(srcCount===0){
    return out;
  }
  // Deterministic index walk keeps visual alignment stable frame-to-frame/reloads.
  const stride = 37;
  for(let i=0;i<targetCount;i++){
    const si = ((i*stride)%srcCount)*3;
    out[i*3] = srcPts[si];
    out[i*3+1] = srcPts[si+1];
    out[i*3+2] = srcPts[si+2];
  }
  return out;
}

function applyCameraAlignedStart(pts, localStarts, opts={}){
  if(!pts || !localStarts) return;
  const attr = pts.geometry.attributes.aStart;
  if(!attr || attr.count*3 !== localStarts.length) return;

  const center = (opts.center || controls.target).clone();
  center.y += (opts.yOffset ?? 12);

  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1).normalize();
  const forward = camera.getWorldDirection(new THREE.Vector3()).normalize();
  const depthScale = opts.depthScale ?? 1.0;

  const p = new THREE.Vector3();
  for(let i=0;i<attr.count;i++){
    const x = localStarts[i*3];
    const y = localStarts[i*3+1];
    const z = localStarts[i*3+2] * depthScale;
    p.copy(center)
      .addScaledVector(right, x)
      .addScaledVector(up, y)
      .addScaledVector(forward, z);
    attr.setXYZ(i, p.x, p.y, p.z);
  }
  attr.needsUpdate = true;
}

// shared transform so the glyph cloud and the solid GLB occupy the SAME space:
// both are centered on the model's center and multiplied by the same scale.
const WORLD = { center:new THREE.Vector3(), scale:90 };

function buildLayer(rawArr, count, sizeScale, brightBoost, startArr){
  const c=WORLD.center, S=WORLD.scale;
  const positions=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    positions[i*3]  =(rawArr[i*3]  -c.x)*S;
    positions[i*3+1]=(rawArr[i*3+1]-c.y)*S;
    positions[i*3+2]=(rawArr[i*3+2]-c.z)*S;
  }
  const rand=new Float32Array(count);
  for(let i=0;i<count;i++) rand[i]=Math.random();
  const starts=new Float32Array(count*3);
  if(startArr && startArr.length===count*3){
    for(let i=0;i<count*3;i++) starts[i]=startArr[i];
  }else{
    for(let i=0;i<count*3;i++) starts[i]=positions[i];
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('aRand',new THREE.BufferAttribute(rand,1));
  geo.setAttribute('aStart',new THREE.BufferAttribute(starts,3));
  const u=Object.assign({},{
    uTex:{value:atlas.tex}, uCols:{value:atlas.cols}, uRows:{value:atlas.rows}, uNumGlyph:{value:atlas.uniq.length},
    uTime:uniforms.uTime, uSize:{value:sizeScale}, uPixelRatio:{value:Math.min(devicePixelRatio,2)},
    uAmber:{value:CONFIG.AMBER}, uGreen:{value:CONFIG.GREEN}, uBright:{value:brightBoost},
    uProgress:uniforms.uProgress, uFallHeight:{value:260.0},
    uNear:{value:1.0}, uFar:{value:400.0}, uFog:{value:new THREE.Color('#0c0f11')},
    uDissolve:{value:0.0},
  });
  const mat=new THREE.ShaderMaterial({ uniforms:u, vertexShader:vert, fragmentShader:frag,
    transparent:true, depthWrite:false, blending:THREE.NormalBlending });
  return { mesh:new THREE.Points(geo,mat), geo };
}

fetch('car-points.json').then(r=>r.json()).then(data=>{
  WORLD.center.fromArray(data.center);   // share the exact model center
  const nameBase = buildTextPointCloud(Math.max(data.shape.count, data.legible.count), {
    text:'DANIEL BENJAMIN',
    font:'900 140px "Space Grotesk", "Archivo", sans-serif',
    outWidth:336,
    outHeight:68,
    depth:6,
    step:3,
  });

  // Build one canonical start cloud, then reuse exact coordinates for legible.
  const shapeStart = sampleFromPointCloud(nameBase, data.shape.count);
  const legibleStart = shapeStart.slice(0, data.legible.count*3);

  const shape = buildLayer(data.shape.pts, data.shape.count, 20.0, SHAPE_BRIGHT_BASE, shapeStart);   // small, holds the form
  const legible = buildLayer(data.legible.pts, data.legible.count, 58.0, LEGIBLE_BRIGHT_BASE, legibleStart); // big, bright
  points=shape.mesh; points2=legible.mesh;
  scene.add(points); scene.add(points2);

  loadSolidCar();   // load the real GLB into the same space (starts invisible)

  shape.geo.computeBoundingSphere();
  const radius=shape.geo.boundingSphere.radius;
  const dist=radius/Math.tan((camera.fov*Math.PI/180)/2)*1.35;
  camera.position.set(dist*0.62, dist*0.30, dist*0.62);

  // Tight clip planes around the subject to maximize depth-buffer precision.
  // A very wide near/far range causes z-fighting flicker on detailed meshes.
  camera.near = Math.max(0.5, dist - radius * 2.4);
  camera.far = dist + radius * 3.2;
  camera.updateProjectionMatrix();

  controls.target.set(0,0,0); controls.update();

  // Align the name glyph field to camera view so it reads cleanly before morph.
  applyCameraAlignedStart(points, shapeStart, { yOffset: 16, depthScale: 0.75 });
  applyCameraAlignedStart(points2, legibleStart, { yOffset: 16, depthScale: 0.75 });

  // set the rain "sky" height so glyphs start above the visible frustum top.
  // visible half-height at the model's depth ≈ tan(fov/2)*distance; add margin.
  const camDist = camera.position.length();
  const halfH = Math.tan((camera.fov*Math.PI/180)/2)*camDist;
  const sky = halfH*1.6 + radius;   // comfortably above the top of the screen
  points.material.uniforms.uFallHeight.value = sky;
  points2.material.uniforms.uFallHeight.value = sky;

  // depth-cue range: map near/far to the model's front and back faces at this
  // camera distance, so the depth fade spans exactly the car's own thickness.
  const near = camDist - radius;
  const far  = camDist + radius;
  for(const m of [points, points2]){
    m.material.uniforms.uNear.value = near;
    m.material.uniforms.uFar.value  = far;
  }

  if(loading) loading.style.display='none';
  pointsReady = true;
  maybeStartNameAssemble();
}).catch(err=>{ console.error(err); if(loading) loading.innerHTML='could not load model'; });

// ---- the SOLID car: loaded into the same space, revealed as you scroll ----
let solidCar = null;
const solidMats = [];        // for fading opacity in
let morphPrewarmed = false;

function prewarmMorphPass(){
  if(morphPrewarmed || !points || !points2 || !solidCar || solidMats.length===0) return;

  const d1 = points.material.uniforms.uDissolve.value;
  const d2 = points2.material.uniforms.uDissolve.value;
  const wasSolidVisible = solidCar.visible;
  const ops = solidMats.map(m=>m.opacity);
  const dws = solidMats.map(m=>m.depthWrite);

  // Warm shaders/buffers with a representative mid-morph frame, but keep it hidden.
  points.material.uniforms.uDissolve.value = 0.35;
  points2.material.uniforms.uDissolve.value = 0.35;
  solidCar.visible = true;
  for(const mat of solidMats){
    mat.opacity = 0.02;
    mat.depthWrite = false;
  }

  renderer.compile(scene, camera);
  renderer.render(scene, camera);

  points.material.uniforms.uDissolve.value = d1;
  points2.material.uniforms.uDissolve.value = d2;
  solidCar.visible = wasSolidVisible;
  for(let i=0;i<solidMats.length;i++){
    solidMats[i].opacity = ops[i];
    solidMats[i].depthWrite = dws[i];
  }

  morphPrewarmed = true;
}

function loadSolidCar(){
  const draco=new DRACOLoader();
  draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
  const gl=new GLTFLoader(); gl.setDRACOLoader(draco);
  gl.load(CONFIG.MODEL_URL,(gltf)=>{
    const m=gltf.scene;

    // Center + scale EXACTLY like the working chassis viewer: measure the model's
    // own bounding box, recenter on origin, then scale. A wrapper group lets us
    // scale uniformly without disturbing the recentering.
    const box=new THREE.Box3().setFromObject(m);
    const center=box.getCenter(new THREE.Vector3());
    m.position.sub(center);                 // recenter on origin (scale 1)

    const wrap=new THREE.Group();
    wrap.add(m);
    wrap.scale.setScalar(WORLD.scale);      // scale the whole thing to the glyph world
    wrap.visible=false;
    solidCar=wrap; scene.add(wrap);

    // transparent for the fade-in, but KEEP depthWrite so faces sort correctly
    // (depthWrite:false was causing the see-through / deforming look).
    m.traverse(o=>{ if(o.isMesh && o.material){
      const mats=Array.isArray(o.material)?o.material:[o.material];
      mats.forEach(mat=>{ mat.transparent=true; mat.opacity=0; solidMats.push(mat); });
    }});

    // re-align the GLYPH layers to this authoritative (three.js-measured) center,
    // so code and solid car share the exact same space regardless of the bake.
    realignGlyphs(center);

    // lighting identical to chassis-viewer so the solid car reads the same
    scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x202428, 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3,5,2); scene.add(key);
    const rim = new THREE.DirectionalLight(0xffb454, 0.8); rim.position.set(-4,2,-3); scene.add(rim);
    const fill= new THREE.DirectionalLight(0x5ee6a0, 0.25); fill.position.set(0,-3,4); scene.add(fill);
  },undefined,(e)=>console.warn('solid car load failed (points-only hero is fine):',e));
}

// shift the glyph clouds so their center matches the solid car's measured center
function realignGlyphs(trueCenter){
  const delta=trueCenter.clone().sub(WORLD.center);   // difference from the baked center
  if(delta.lengthSq()<1e-12) return;
  for(const pts of [points, points2]){
    if(!pts) continue;
    const pos=pts.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      pos.setXYZ(i,
        pos.getX(i)-delta.x*WORLD.scale,
        pos.getY(i)-delta.y*WORLD.scale,
        pos.getZ(i)-delta.z*WORLD.scale);
    }
    pos.needsUpdate=true;
    pts.geometry.computeBoundingSphere();
  }
}

// ---- scroll → morph progress (0 = all code, 1 = solid car) ----
let morphTarget = 0;
let morphCurrent = 0;
function computeMorph(){
  // morph completes over the first viewport-height of scrolling
  const h = window.innerHeight;
  const y = window.scrollY || window.pageYOffset || 0;
  morphTarget = Math.max(0, Math.min(1, y / (h*0.9)));
}
window.addEventListener('scroll', computeMorph, {passive:true});
computeMorph();

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w||canvas.height!==h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
const clock=new THREE.Clock();
function loop(){
  resize();
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();
  uniforms.uTime.value = reduce ? 0 : t;

  if(!morphPrewarmed){
    prewarmMorphPass();
  }

  if(reduce){
    nameAssemble = 1;
  }else if(nameAssembleStart!==null){
    const elapsed = t - nameAssembleStart;
    const active = Math.max(0, elapsed - NAME_HOLD_DURATION);
    nameAssemble = Math.min(1, active / NAME_ASSEMBLE_DURATION);
  }
  uniforms.uProgress.value = THREE.MathUtils.smootherstep(nameAssemble, 0, 1);

  // Smoothly chase scroll progress so morphing is fluid instead of jumpy.
  morphCurrent = THREE.MathUtils.damp(morphCurrent, morphTarget, 7.0, dt);

  // ---- code → solid car morph, driven by scroll ----
  // glyphs dissolve as the solid car fades in; both share the same space so it
  // reads as ONE object resolving from code into hardware.
  const mRaw = reduce ? morphCurrent : (nameAssemble>=0.999 ? morphCurrent : 0);
  const m = THREE.MathUtils.smootherstep(mRaw, 0, 1);
  if(points && points2){
    // Keep only one readable name cloud during the text phase.
    const shapeBlend = reduce ? 1 : THREE.MathUtils.smoothstep(nameAssemble, 0.82, 1.0);
    points.visible = shapeBlend > 0.001;
    points.material.uniforms.uBright.value = SHAPE_BRIGHT_BASE * shapeBlend;
    points2.material.uniforms.uBright.value = LEGIBLE_BRIGHT_BASE;

    points.material.uniforms.uDissolve.value = m;
    points2.material.uniforms.uDissolve.value = m;
  }
  if(solidCar){
    solidCar.visible = m > 0.001;
    const op = THREE.MathUtils.smoothstep(m, 0.1, 0.9);  // softer fade over most of the morph
    for(const mat of solidMats){
      mat.opacity = op;
      // Avoid depth-occluding glyphs while the solid car is still mostly transparent.
      mat.depthWrite = op > 0.2;
    }
  }

  // turntable once assembled; keep rotating through the morph so it stays alive
  controls.autoRotate = !reduce;
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
