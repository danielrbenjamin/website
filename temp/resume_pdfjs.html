<script>
/* fail-safe OUTSIDE the module: if the PDF.js module fails to even load
   (CDN down, CORS, blocked), the module's own try/catch never runs — so this
   timeout guarantees the fallback message appears instead of a stuck spinner. */
window.__pdfRendered = false;
setTimeout(function(){
  if(window.__pdfRendered) return;
  var s = document.getElementById('pdf-status');
  if(s && document.querySelectorAll('#pdf-doc canvas').length === 0){
    s.className = 'pdf-status err';
    s.innerHTML = "couldn't render the résumé inline here.<br><br>use <b>Open in new tab</b> or <b>Download PDF</b> above to view it.";
  }
}, 6000);
</script>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';

const PDF_URL = 'https://cdn.jsdelivr.net/gh/danielrbenjamin/resume@main/tesla_format/Daniel_Benjamin_Resume.pdf';
const docEl = document.getElementById('pdf-doc');
const statusEl = document.getElementById('pdf-status');

// render at higher pixel density for crisp text on retina screens
const SCALE = Math.min(window.devicePixelRatio || 1, 2);

function fail(){
  statusEl.className = 'pdf-status err';
  statusEl.innerHTML = `couldn't render the résumé inline here.<br><br>use <b>Open in new tab</b> or <b>Download PDF</b> above to view it.`;
}

(async function(){
  try{
    const pdf = await pdfjsLib.getDocument({ url: PDF_URL }).promise;
    statusEl.remove();
    window.__pdfRendered = true;

    // width to render pages at — cap so it doesn't exceed the container
    const containerW = docEl.clientWidth || 800;

    for(let n = 1; n <= pdf.numPages; n++){
      const pdfPage = await pdf.getPage(n);
      const baseViewport = pdfPage.getViewport({ scale: 1 });
      // scale each page to fill the container width, times device pixel ratio for sharpness
      const cssScale = Math.min(containerW / baseViewport.width, 1.15);
      const viewport = pdfPage.getViewport({ scale: cssScale * SCALE });

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      // display size (CSS) = logical size; canvas backing store = *SCALE for crispness
      canvas.style.width = (viewport.width / SCALE) + 'px';
      docEl.appendChild(canvas);

      await pdfPage.render({ canvasContext: ctx, viewport }).promise;
    }
  }catch(e){
    console.error('PDF render failed:', e);
    fail();
  }
})();

// reveal
const io=new IntersectionObserver((es)=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
},{threshold:.1,rootMargin:'0px 0px -30px 0px'});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
