.pdf-frame{
  width:100%;height:calc(100vh - 220px);min-height:600px;
  border:1px solid var(--line);border-radius:6px;background:#0a0c0d;
}
/* mobile fallback — inline PDF often fails on phones */
.pdf-fallback{
  display:none;border:1px dashed var(--line-bright);border-radius:6px;
  background:var(--panel);padding:40px 28px;text-align:center;
  font-family:var(--mono);font-size:13px;color:var(--ink-dim);line-height:1.7;
}
.pdf-fallback b{color:var(--amber)}
@media(max-width:760px){
  .pdf-frame{display:none}
  .pdf-fallback{display:block}
}
