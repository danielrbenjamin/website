<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Daniel Benjamin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site-header.css">
<script src="site-header.js" defer></script>
<script src="site-footer.js" defer></script>
<script src="site-console.js" defer></script>
<style>
/* 404-only: pin footer to viewport bottom even though this page is short */
html,body{height:100%}
body{display:flex;flex-direction:column}
main.wrap{flex:1 0 auto;width:100%}
footer.wrap{flex-shrink:0;width:100%}

/* 404-only: glitch heading + off-course diagram */
.err-hero{padding-top:150px;padding-bottom:110px;text-align:center}
.glitch-title{
  font-family:var(--disp);font-weight:800;letter-spacing:-.04em;line-height:.88;
  font-size:clamp(5.5rem,24vw,11rem);color:var(--ink);position:relative;display:inline-block;
}
.glitch-title::before,.glitch-title::after{
  content:attr(data-text);position:absolute;inset:0;pointer-events:none;
}
.glitch-title::before{color:var(--amber);clip-path:inset(0 0 0 0);animation:glitch1 3.4s infinite linear alternate-reverse}
.glitch-title::after{color:var(--green);clip-path:inset(0 0 0 0);animation:glitch2 2.7s infinite linear alternate-reverse}
@keyframes glitch1{
  0%,100%{clip-path:inset(0 0 92% 0);transform:translate(0,0)}
  10%{clip-path:inset(10% 0 76% 0);transform:translate(-3px,0)}
  22%{clip-path:inset(40% 0 45% 0);transform:translate(3px,0)}
  34%{clip-path:inset(70% 0 8% 0);transform:translate(-2px,0)}
  46%{clip-path:inset(5% 0 88% 0);transform:translate(2px,0)}
  58%{clip-path:inset(55% 0 30% 0);transform:translate(-3px,0)}
  70%{clip-path:inset(20% 0 65% 0);transform:translate(0,0)}
  82%{clip-path:inset(85% 0 4% 0);transform:translate(3px,0)}
}
@keyframes glitch2{
  0%,100%{clip-path:inset(85% 0 2% 0);transform:translate(0,0)}
  12%{clip-path:inset(30% 0 55% 0);transform:translate(3px,0)}
  24%{clip-path:inset(60% 0 20% 0);transform:translate(-3px,0)}
  36%{clip-path:inset(2% 0 90% 0);transform:translate(2px,0)}
  48%{clip-path:inset(48% 0 38% 0);transform:translate(-2px,0)}
  60%{clip-path:inset(75% 0 12% 0);transform:translate(3px,0)}
  72%{clip-path:inset(15% 0 72% 0);transform:translate(0,0)}
  84%{clip-path:inset(40% 0 48% 0);transform:translate(-3px,0)}
}
.err-code{
  font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:6px;
}
.err-code .ok{color:var(--green)}
.err-tag{color:var(--ink-dim);max-width:520px;margin:18px auto 36px;font-size:1.04rem;line-height:1.65}
.err-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}

@media(max-width:680px){.err-hero{padding-top:120px}}
</style>
</head>
<body>

<div data-site-header></div>

<main class="wrap">

  <section class="err-hero" style="border-top:none">
    <div class="err-code reveal">route lookup <span class="ok">failed</span></div>
    <h1 class="glitch-title reveal" data-text="404">404</h1>
    <p class="err-tag reveal">This path didn't make it off the drawing board. Could've been renamed, moved, or never fabricated in the first place.</p>
    <div class="err-cta reveal">
      <a href="index.html" class="btn solid">← Back to home</a>
    </div>
  </section>

</main>

<div data-site-footer></div>

<script>
const io = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if(entry.isIntersecting){
      entry.target.classList.add('in');
      io.unobserve(entry.target);
    }
  });
}, { threshold:.12, rootMargin:'0px 0px -40px 0px' });
document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
</script>
</body>
</html>
